name: Coletar LottoTrivo - Buscador Dany

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

concurrency:
  group: coleta-lottotrivo
  cancel-in-progress: false

jobs:
  coletar-lottotrivo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install 'requests>=2.31,<3'

      - name: Coletar resultados LottoTrivo
        run: python coletor_lottotrivo.py --dias 2

      - name: Salvar historico e atrasados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultado/lottotrivo_historico.json resultado/lottotrivo_atrasados.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar resultados LottoTrivo'
            git push
          fi

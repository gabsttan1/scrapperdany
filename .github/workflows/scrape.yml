name: Rodar Scraper de Resultados

on:
  schedule:
    # --- LOOK (Removido os horários proibidos: 00:30 e 02:30 BRT) ---
    - cron: '30 10 * * *'
    - cron: '30 12 * * *'
    - cron: '30 14 * * *'
    - cron: '30 17 * * *'
    - cron: '30 19 * * *'
    - cron: '30 21 * * *'
    
    # --- RIO (Removido 00:40 BRT) ---
    - cron: '40 12 * * *'
    - cron: '40 14 * * *'
    - cron: '40 17 * * *'
    - cron: '40 19 * * *'
    - cron: '40 21 * * *'
    
    # --- NACIONAL (Removido 02:00 BRT) ---
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    
    # --- MALUCA (Removido 00:25 BRT) ---
    - cron: '5 13 * * *'
    - cron: '5 15 * * *'
    - cron: '5 18 * * *'
    - cron: '5 22 * * *'
    
    # --- LOTECE ---
    - cron: '5 14 * * *'
    - cron: '5 17 * * *'
    
    # --- LOTEP ---
    - cron: '5 12 * * *'
    - cron: '50 13 * * *'
    - cron: '50 15 * * *'
    - cron: '50 18 * * *'
    - cron: '50 21 * * *'
    - cron: '5 23 * * *'
    
    # --- SP/BAND ---
    - cron: '25 11 * * *'
    - cron: '45 13 * * *'
    - cron: '25 15 * * *'
    - cron: '45 16 * * *'
    - cron: '35 18 * * *'
    - cron: '45 20 * * *'
    - cron: '25 22 * * *'
    - cron: '45 23 * * *'
    
    # --- LBR (Removido 01:35 e 02:45 BRT) ---
    - cron: '45 11 * * *'
    - cron: '35 13 * * *'
    - cron: '35 20 * * *'
    - cron: '35 22 * * *'
    
    # --- FEDERAL ---
    - cron: '10 22 * * 3'
    - cron: '10 22 * * 6'

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2t64 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

      - name: 4. Instalar as dependências do projeto
        run: npm install

      - name: 5. Executar o Scraper
        run: node server.js
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

name: Rodar Scraper de Resultados

on:
  schedule:
    # --- LOOK ---
    - cron: '30 10 * * *'
    - cron: '30 12 * * *'
    - cron: '30 14 * * *'
    - cron: '30 17 * * *'
    - cron: '30 19 * * *'
    - cron: '30 21 * * *'
    - cron: '30 0 * * *'
    - cron: '30 2 * * *'
    # --- RIO ---
    - cron: '40 12 * * *'
    - cron: '40 14 * * *'
    - cron: '40 17 * * *'
    - cron: '40 19 * * *'
    - cron: '40 21 * * *'
    - cron: '40 0 * * *'
    # --- NACIONAL ---
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    # --- MALUCA ---
    - cron: '5 13 * * *'
    - cron: '5 15 * * *'
    - cron: '5 18 * * *'
    - cron: '5 22 * * *'
    - cron: '25 0 * * *'
    # --- LOTECE ---
    - cron: '5 14 * * *'
    - cron: '5 17 * * *'
    # --- LOTEP ---
    - cron: '5 12 * * *'
    - cron: '50 13 * * *'
    - cron: '50 15 * * *'
    - cron: '50 18 * * *'
    - cron: '50 21 * * *'
    - cron: '5 23 * * *'
    # --- SP/BAND ---
    - cron: '25 11 * * *'
    - cron: '45 13 * * *'
    - cron: '25 15 * * *'
    - cron: '45 16 * * *'
    - cron: '35 18 * * *'
    - cron: '45 20 * * *'
    - cron: '25 22 * * *'
    - cron: '45 23 * * *'
    # --- LBR ---
    - cron: '45 11 * * *'
    - cron: '35 13 * * *'
    - cron: '35 20 * * *'
    - cron: '35 22 * * *'
    - cron: '35 1 * * *'
    - cron: '45 2 * * *'
    # --- FEDERAL ---
    - cron: '10 22 * * 3'
    - cron: '10 22 * * 6'

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Instalar dependências do sistema (Puppeteer/Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxss1 libasound2 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1

      - name: 4. Instalar as dependências do projeto
        run: npm install

      - name: 5. Executar o Scraper
        run: node server.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
